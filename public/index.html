<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>browser-ptt · 對講機</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 登入 -->
  <section id="login" class="screen">
    <div class="card">
      <h1>📻 browser-ptt</h1>
      <p class="muted">瀏覽器對講機 — 免安裝 App。</p>
      <form id="login-form">
        <input id="username" placeholder="帳號" autocomplete="username" required />
        <input id="password" type="password" placeholder="密碼" autocomplete="current-password" required />
        <button type="submit">登入</button>
      </form>
      <p id="login-error" class="error" hidden></p>
      <p class="muted small">示範帳號:david / d123 · maggie / m123</p>
      <p class="muted small">📖 <a href="/help.html">中文使用說明</a></p>
      <p class="muted small">或 <a href="/direct.html">🔒 1 對 1 私密通話(免登入、無伺服器)</a></p>
    </div>
  </section>

  <!-- 主畫面 -->
  <section id="app" class="screen" hidden>
    <header class="topbar">
      <span class="who">👤 <b id="me"></b></span>
      <select id="channel-select" aria-label="頻道"></select>
      <button id="relogin" class="ghost">🔄 重新連線</button>
      <button id="logout" class="ghost">登出</button>
    </header>

    <main class="main">
      <div class="controls">
        <div class="status-card">
          <div id="status-dot" class="dot idle"></div>
          <div id="status-text">待機</div>
        </div>
        <div class="netmode">
          <select id="net-mode" aria-label="連線模式">
            <option value="lan">內網 · 區網直連</option>
            <option value="wan">外網 · 跨網路</option>
          </select>
          <button id="turn-test" type="button" class="ghost" title="測試外網 TURN 是否正常">🔍 檢測</button>
        </div>
      </div>

      <button id="enable-audio" class="ghost" hidden>🔊 點一下開啟聲音</button>

      <!-- 大顆按住說話,放在訊息上方 -->
      <button id="ptt" class="ptt" disabled>🎤 按住說話</button>
      <p id="hint" class="muted small"></p>

      <div class="lower">
        <div class="online">
          <h2>🟢 在線 <span id="online-count" class="count">0</span></h2>
          <ul id="online-list"></ul>
        </div>

        <div class="chat">
          <div class="chat-head">
            <h2>💬 訊息</h2>
            <a href="/help.html" target="_blank" class="muted small">📖 說明</a>
          </div>
          <ul id="chat-log"></ul>
          <div id="quick-chips" class="quick-chips"></div>
          <!-- 一個輸入框:送出=發訊息,加入=存成快速句子 -->
          <form id="chat-form">
            <input id="chat-input" placeholder="輸入訊息…" autocomplete="off" maxlength="500" />
            <button type="submit" class="send">送出</button>
            <button id="quick-add-btn" type="button" class="ghost">加入</button>
          </form>
        </div>
      </div>
    </main>
  </section>

  <!-- 遠端對象的音訊元素會掛在這裡 -->
  <div id="audio-sink" hidden></div>

  <script src="app.js"></script>
</body>
</html>
