<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>browser-ptt · 對講機</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 登入 -->
  <section id="login" class="screen">
    <div class="card">
      <h1>📻 browser-ptt</h1>
      <p class="muted">瀏覽器對講機 — 免安裝 App。</p>
      <form id="login-form">
        <input id="username" placeholder="帳號" autocomplete="username" required />
        <input id="password" type="password" placeholder="密碼" autocomplete="current-password" required />
        <button type="submit">登入</button>
      </form>
      <p id="login-error" class="error" hidden></p>
      <p class="muted small">示範帳號:david / d123 · maggie / m123</p>
      <p class="muted small">📖 <a href="/help.html">中文使用說明</a></p>
      <p class="muted small">或 <a href="/direct.html">🔒 1 對 1 私密通話(免登入、無伺服器)</a></p>
    </div>
  </section>

  <!-- 主畫面 -->
  <section id="app" class="screen" hidden>
    <header class="topbar">
      <span class="who">👤 <b id="me"></b></span>
      <select id="channel-select" aria-label="頻道"></select>
      <button id="relogin" class="ghost">🔄 重新連線</button>
      <button id="logout" class="ghost">登出</button>
    </header>

    <main class="main">
      <div class="status-card">
        <div id="status-dot" class="dot idle"></div>
        <div id="status-text">待機</div>
      </div>

      <div class="netmode">
        <span class="muted small">連線模式</span>
        <select id="net-mode" aria-label="連線模式">
          <option value="lan">內網（區網直連 · 不用 TURN）</option>
          <option value="wan">外網（跨網路 · 需要時用 TURN）</option>
        </select>
      </div>

      <button id="ptt" class="ptt" disabled>
        <span class="ptt-label">按住說話</span>
      </button>
      <button id="enable-audio" class="ghost" hidden>🔊 點一下開啟聲音</button>
      <p id="hint" class="muted small"></p>

      <div class="online">
        <h2>🟢 在線 <span id="online-count" class="count">0</span></h2>
        <ul id="online-list"></ul>
      </div>

      <div class="chat">
        <h2>💬 訊息</h2>
        <button id="chat-quick" class="ghost" type="button">🔈 通知對方:聽不到聲音,請切「外網」</button>
        <ul id="chat-log"></ul>
        <form id="chat-form">
          <input id="chat-input" placeholder="輸入訊息…" autocomplete="off" maxlength="500" />
          <button type="submit">送出</button>
        </form>
      </div>

      <p class="muted small" style="margin-top: 4px;">📖 <a href="/help.html" target="_blank">中文使用說明</a></p>
    </main>
  </section>

  <!-- 遠端對象的音訊元素會掛在這裡 -->
  <div id="audio-sink" hidden></div>

  <script src="app.js"></script>
</body>
</html>
